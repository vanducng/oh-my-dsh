name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      republish_tag:
        description: Existing release tag to publish any missing npm packages
        required: false
        type: string

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.republish.outputs.release_created || steps.release.outputs.release_created }}
      tag_name: ${{ steps.republish.outputs.tag_name || steps.release.outputs.tag_name }}
      version: ${{ steps.republish.outputs.version || steps.release.outputs.version }}
    steps:
      - name: Republish existing tag
        id: republish
        if: github.event_name == 'workflow_dispatch' && inputs.republish_tag != ''
        env:
          TAG: ${{ inputs.republish_tag }}
        run: |
          set -euo pipefail
          echo "release_created=true" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"

      - name: Generate MiuMun app token
        id: app_token
        if: steps.republish.outputs.release_created != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_MUNMIU_PRIVATE_KEY }}

      - name: Open or update release PR
        id: release
        if: steps.republish.outputs.release_created != 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          token: ${{ steps.app_token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Resolve release PR
        id: release-pr
        if: steps.republish.outputs.release_created != 'true' && steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          echo "number=$(jq -er '.number' <<< "${RELEASE_PR}")" >> "${GITHUB_OUTPUT}"

      - name: Merge green release PR
        if: steps.release-pr.outputs.number
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_NUMBER: ${{ steps.release-pr.outputs.number }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(gh pr view "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json headRefOid \
            --jq '.headRefOid')"
          for _ in {1..60}; do
            if ! REQUIRED_CHECKS="$(gh pr checks "${PR_NUMBER}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json name \
                --jq '[.[] | select(.name == "test (22)" or .name == "test (24)")] | unique_by(.name) | length' \
                2>/dev/null)"; then
              REQUIRED_CHECKS=0
            fi
            if [ "${REQUIRED_CHECKS}" -eq 2 ]; then
              gh pr checks "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --watch --fail-fast
              FAILED_CHECKS="$(gh pr checks "${PR_NUMBER}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json name,state \
                --jq '[.[] | select((.name == "test (22)" or .name == "test (24)") and .state != "SUCCESS")] | length')"
              if [ "${FAILED_CHECKS}" -ne 0 ]; then
                echo "Release PR required checks did not pass." >&2
                exit 1
              fi
              gh pr merge "${PR_NUMBER}" \
                --repo "${GITHUB_REPOSITORY}" \
                --squash \
                --match-head-commit "${HEAD_SHA}"
              exit 0
            fi
            sleep 2
          done
          echo "Release PR checks were not registered within two minutes." >&2
          exit 1

  validate:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node (v7.0.0)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false

      - name: Pin supported npm CLI
        run: npm install --global npm@11.18.0

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package and tag
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          CLI_NAME="$(node -p "require('./apps/omdsh/package.json').name")"
          TUI_NAME="$(node -p "require('./packages/tui/omdsh-tui/package.json').name")"
          CLI_VERSION="$(node -p "require('./apps/omdsh/package.json').version")"
          TUI_VERSION="$(node -p "require('./packages/tui/omdsh-tui/package.json').version")"
          ROOT_VERSION="$(node -p "require('./package.json').version")"

          if [ "${CLI_NAME}" != "@vanducng/oh-my-dsh" ]; then
            echo "Unexpected CLI package name: ${CLI_NAME}" >&2
            exit 1
          fi
          if [ "${TUI_NAME}" != "@vanducng/dsh-tui" ]; then
            echo "Unexpected TUI package name: ${TUI_NAME}" >&2
            exit 1
          fi
          if [ "${CLI_VERSION}" != "${TUI_VERSION}" ] || [ "${CLI_VERSION}" != "${ROOT_VERSION}" ]; then
            echo "Package versions are not synchronized: root=${ROOT_VERSION} cli=${CLI_VERSION} tui=${TUI_VERSION}" >&2
            exit 1
          fi
          if [ "${TAG_NAME}" != "v${CLI_VERSION}" ]; then
            echo "Tag ${TAG_NAME} does not match package version ${CLI_VERSION}" >&2
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main

      - name: Check Markdown
        run: pnpm check:md

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Happy-path smoke
        run: pnpm smoke:happy

      - name: TUI grid smoke
        run: pnpm smoke:tui

      - name: Test packed CLI
        run: pnpm test:package

      - name: Pack release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          pnpm --filter @vanducng/dsh-tui pack --pack-destination release-artifacts
          pnpm --filter @vanducng/oh-my-dsh pack --pack-destination release-artifacts
          VERSION="$(node -p "require('./apps/omdsh/package.json').version")"
          dry_run_if_new() {
            local package="$1"
            local tarball="$2"
            if [ "$(npm view "${package}@${VERSION}" version 2>/dev/null)" = "${VERSION}" ]; then
              echo "skip dry-run ${package}@${VERSION} already on npm"
              return 0
            fi
            npm publish --dry-run --ignore-scripts "${tarball}"
          }
          dry_run_if_new @vanducng/dsh-tui ./release-artifacts/vanducng-dsh-tui-*.tgz
          dry_run_if_new @vanducng/oh-my-dsh ./release-artifacts/vanducng-oh-my-dsh-*.tgz

      - name: Upload release artifact (v7.0.1)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: npm-package
          path: release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs:
      - release-please
      - validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node (v7.0.0)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin supported npm CLI
        run: npm install --global npm@11.18.0

      - name: Download release artifact (v8.0.1)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: npm-package

      - name: Publish TUI then CLI with OIDC
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail

          published() {
            [ "$(npm view "$1@${VERSION}" version 2>/dev/null)" = "${VERSION}" ]
          }

          publish_if_missing() {
            local package="$1"
            local tarball="$2"
            if published "${package}"; then
              echo "${package}@${VERSION} already on npm"
              return 0
            fi
            npm publish --access public --ignore-scripts "${tarball}"
          }

          publish_if_missing @vanducng/dsh-tui ./vanducng-dsh-tui-*.tgz
          for _ in $(seq 1 20); do
            if published @vanducng/dsh-tui; then
              publish_if_missing @vanducng/oh-my-dsh ./vanducng-oh-my-dsh-*.tgz
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for @vanducng/dsh-tui@${VERSION}" >&2
          exit 1

      - name: Verify registry versions
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          for package in @vanducng/dsh-tui @vanducng/oh-my-dsh; do
            ok=0
            for _ in 1 2 3 4 5; do
              if [ "$(npm view "${package}@${VERSION}" version 2>/dev/null)" = "${VERSION}" ]; then
                ok=1
                break
              fi
              sleep 3
            done
            if [ "${ok}" -ne 1 ]; then
              echo "Missing ${package}@${VERSION}" >&2
              exit 1
            fi
          done
